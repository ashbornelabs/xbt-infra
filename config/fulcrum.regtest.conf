# Fulcrum Electrum server for the Knots regtest node.
# It reaches Knots over the compose network with the regtest-only credentials of bitcoin.regtest.conf.

bitcoind = knots:18443
rpcuser = foo
rpcpassword = bar

tcp = 0.0.0.0:50001
ssl = 0.0.0.0:50002

# Poll the node often, so new blocks reach clients quickly in tests.
polltime = 0.5

# A private test server: no peer discovery and no announcements.
peering = false
announce = false

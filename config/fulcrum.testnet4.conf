# Fulcrum Electrum server for the Knots testnet4 node.
# It reaches Knots over the compose network, with the cookie from Knots' datadir (rpccookie, set in
# compose.testnet4.yaml).

bitcoind = knots:48332

tcp = 0.0.0.0:50001
ssl = 0.0.0.0:50002

# A private development server: no peer discovery and no announcements.
peering = false
announce = false

# Knots regtest node for development and CI.
# The RPC credentials are the ones ACINQ's test suites expect. They are only safe because the node runs
# regtest and its ports are published on 127.0.0.1: never use them on another network.

regtest=1
server=1
txindex=1
printtoconsole=1
fallbackfee=0.0001
rpcworkqueue=64
rpcuser=foo
rpcpassword=bar

zmqpubrawblock=tcp://0.0.0.0:29000
zmqpubrawtx=tcp://0.0.0.0:29001
zmqpubhashblock=tcp://0.0.0.0:29002

[regtest]
port=18444
rpcport=18443
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0

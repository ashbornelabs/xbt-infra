name: Smoke tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the shell scripts
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x bin/xbt checks/*.sh

      - name: Check the Dockerfiles
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < images/knots/Dockerfile

      - name: Check the workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Check the compose file
        run: docker compose config --quiet

  regtest:
    name: Regtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the environment
        run: bin/xbt up

      - name: Check the BLAKE2b activation
        run: checks/activation.sh

      - name: Show the logs
        if: failure()
        run: bin/xbt logs

      - name: Stop the environment
        if: always()
        run: bin/xbt down

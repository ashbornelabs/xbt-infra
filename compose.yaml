name: xbt

services:
  knots:
    build:
      context: images/knots
      args:
        KNOTS_VERSION: ${KNOTS_VERSION:?}
        KNOTS_SHA256_AMD64: ${KNOTS_SHA256_AMD64:?}
        KNOTS_SHA256_ARM64: ${KNOTS_SHA256_ARM64:?}
    image: xbt-infra/knots:${KNOTS_VERSION:?}
    command:
      - -conf=/etc/bitcoin/bitcoin.conf
      - -datadir=/data
      - -testactivationheight=blake2b@${XBT_BLAKE2B_HEIGHT:?}
      - -rdtsexpiry=${XBT_RDTS_EXPIRY:?}
      - -rpcuser=${XBT_RPC_USER:?}
      - -rpcpassword=${XBT_RPC_PASSWORD:?}
    volumes:
      - ./config/bitcoin.regtest.conf:/etc/bitcoin/bitcoin.conf:ro
      - knots-data:/data
    ports:
      - 127.0.0.1:18443:18443
      - 127.0.0.1:18444:18444
      - 127.0.0.1:29000:29000
      - 127.0.0.1:29001:29001
      - 127.0.0.1:29002:29002
    healthcheck:
      test:
        - CMD
        - bitcoin-cli
        - -conf=/etc/bitcoin/bitcoin.conf
        - -rpcuser=${XBT_RPC_USER:?}
        - -rpcpassword=${XBT_RPC_PASSWORD:?}
        - getblockchaininfo
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - regtest

  # The image runs as root and keeps its data in a root-owned volume, so it is not run as another user.
  fulcrum:
    image: ${FULCRUM_IMAGE:?}
    command: ["Fulcrum", "/etc/fulcrum/fulcrum.conf"]
    environment:
      RPCUSER: ${XBT_RPC_USER:?}
      RPCPASSWORD: ${XBT_RPC_PASSWORD:?}
    depends_on:
      knots:
        condition: service_healthy
    volumes:
      - ./config/fulcrum.regtest.conf:/etc/fulcrum/fulcrum.conf:ro
      - fulcrum-data:/data
    ports:
      - 127.0.0.1:51001:50001
      - 127.0.0.1:51002:50002
    healthcheck:
      # Fulcrum opens its Electrum port once it has indexed the chain.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 50001), 2)"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - regtest

volumes:
  knots-data:
  fulcrum-data:

networks:
  regtest:
